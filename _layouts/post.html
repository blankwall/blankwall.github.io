<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title | escape }} - blankwall</title>
    {% if page.description %}
    <meta name="description" content="{{ page.description | escape }}">
    {% endif %}
    <link rel="stylesheet" href="{{ '/style.css' | relative_url }}">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="nav-brand">
                <a href="{{ '/index.html' | relative_url }}">blankwall</a>
            </div>
            <div class="nav-links">
                <a href="{{ '/index.html' | relative_url }}">Home</a>
                <a href="{{ '/about.html' | relative_url }}">About</a>
            </div>
        </div>
    </nav>

    <main class="container">
        <article>
            {{ content }}
        </article>
    </main>

    <footer>
        <div class="container">
            <p>&copy; {{ page.date | date: '%Y' }} blankwall</p>
        </div>
    </footer>
</body>
</html>
